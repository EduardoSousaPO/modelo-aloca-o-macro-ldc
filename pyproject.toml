[project]
name = "estrategia-macro-ldc-dados"
version = "0.1.0"
description = "Pipeline de extração de séries macro e índices de ativos brasileiros + análise de regimes macro para o Comitê de Alocação da LDC Capital"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandera>=0.20",
    "duckdb>=1.0",          # engine de consulta sobre o Parquet (ADR-006)
    "openpyxl>=3.1",        # lê os .xls da ANBIMA (que são XLSX) + escreve o XLSX de entrega (RF-043)
    "lxml>=5.0",            # pandas.read_html na Curva Zero da ANBIMA (que é HTML <table>)
    "yfinance>=0.2.50",     # plano B do FRED (^TNX, ^VIX, ^GSPC) — FRED bloqueado nesta máquina
    "matplotlib>=3.8",      # heatmap regime × ativo (RF-033) e timeline (RF-035)
    "python-dotenv>=1.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages/shared/schemas/` JÁ é pacote de verdade (tem `__init__.py` e imports absolutos
# `from packages.shared.schemas import ...`), então o wheel precisa embarcá-lo: sem isto,
# `pip install -e .` instala um pacote vazio e o import quebra no CI.
# `apps/` ainda não tem código (só `.gitkeep`) — acrescente "apps" a esta lista na feature que
# criar `apps/pipeline/` (F-001), junto com os `__init__.py` correspondentes.
packages = ["packages"]

# ─────────────────────────────────────────────
# ruff — lint + format (substitui ESLint/Prettier deste harness)
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
# `.claude/` traz código de skill vendorizado (96 erros de lint que não são nossos) e `data/`
# é dado reconstruível — nenhum dos dois é código deste projeto.
# `*.md`: ruff >= 0.14 formata trechos Python dentro de Markdown, e os docs (`docs/research/` em
# especial, que é imutável para o agente) têm snippets ilustrativos de propósito não formatados.
exclude = [".venv", "venv", ".claude", "data", ".ipynb_checkpoints", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]
# Sem `ignore`: a PD901 que estava aqui foi REMOVIDA do ruff (>= 0.5 emite
# "rules have been removed and ignoring them has no effect") e poluía a saída do CI N1.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"apps/analysis/**" = ["E402"]  # notebooks exportados podem ter import depois de código

# ─────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Raiz no `sys.path`: é o que faz `from packages.shared.schemas import ...` resolver sem depender
# de `pip install -e .` (o modo `prepend` insere o diretório do teste, não a raiz do repo).
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "network: teste que faz chamada real a uma fonte externa (não roda no CI N1)",
    "slow: teste que leva mais de alguns segundos",
]
