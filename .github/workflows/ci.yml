name: CI

# Harness v3.2 — adaptado para projeto de dados/quant (Python)
#
# CI por níveis (N1 / N2 / N3). A classe de risco da feature (A / B / C / D — ver AGENTS.md §2)
# determina o nível mínimo que PRECISA estar verde antes do merge.
#
#   N1 — ruff check + ruff format --check + pytest tests/unit          → obrigatório para A, B
#   N2 — N1 + pytest tests/integration tests/contract (schemas pandera
#        sobre fixtures) + build do canônico a partir de fixtures      → obrigatório para B relevante, C
#   N3 — N2 + pytest tests/e2e (pipeline ponta a ponta) + conferência
#        de reprodutibilidade (rodar 2x → mesmo hash)                  → obrigatório para C crítica, D
#
# Regra deste projeto: NENHUM job de CI chama fonte externa. Testes de rede ficam marcados
# `@pytest.mark.network` e são excluídos com `-m "not network"`. Fonte externa em teste é sempre
# fixture gravada em tests/fixtures/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────
  # N1 — Sempre roda. Bloqueia merge para qualquer feature A/B/C/D.
  # ───────────────────────────────────────────────────────────────
  n1-basic:
    name: N1 — Lint + Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Unit tests
        run: pytest tests/unit -m "not network"

  # ───────────────────────────────────────────────────────────────
  # N2 — Roda em PR e em push para main. Obrigatório para B relevante/C.
  # Habilitado em 2026-10-11 (QA Onda 3, P1-4 / decisão D-y): a Onda 3/4 entregou
  # `tests/contract/` (10 arquivos) e o orquestrador `apps.pipeline` (F-029), que é o
  # "build do canônico a partir de fixtures" que este nível exige.
  # `tests/integration/` ainda está VAZIO — o passo está comentado abaixo, nomeado, em vez
  # de chamar uma pasta sem teste (pytest sairia com código 5 e o job ficaria vermelho sem
  # defeito nenhum). Quem criar o primeiro teste de integração descomenta 2 linhas.
  # ───────────────────────────────────────────────────────────────
  n2-integration:
    name: N2 — Contract (pandera) + Build canônico de fixtures
    needs: n1-basic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # - name: Integration tests (tests/integration ainda vazio — ver nota acima)
      #   run: pytest tests/integration -m "not network"
      - name: Contract tests (schemas pandera)
        run: pytest tests/contract -m "not network"
      - name: Build do canônico a partir das fixtures versionadas
        # Árvore de trabalho fora do repo, com data/processed/ copiado de tests/fixtures/.
        # `--ate build_raw_series` é o trecho que as fixtures sustentam (F-029 §4);
        # `--sem-duckdb` deixa data/canonical/ integralmente determinístico (decisão F-029 (b)).
        run: |
          set -euo pipefail
          ARVORE="$RUNNER_TEMP/n2"
          mkdir -p "$ARVORE/data"
          cp -r tests/fixtures/processed "$ARVORE/data/processed"
          python -m apps.pipeline run --offline --ate build_raw_series --sem-duckdb --raiz "$ARVORE"
      - name: Validar o canônico gerado (sha256 x MANIFEST.json)
        run: python -m apps.pipeline verify --raiz "$RUNNER_TEMP/n2"

  # ───────────────────────────────────────────────────────────────
  # N3 — Só em PR para main, ou manual. Obrigatório para C crítica/D.
  # Habilitado em 2026-10-11 (QA Onda 3, P1-4 / decisão D-y): `tests/e2e/` existe
  # (F-029, 6 testes) e o par run/verify fecha a conferência de reprodutibilidade
  # (rodar 2x -> mesmo MANIFEST.json e mesmo agregado DATASET_SHA256).
  # ───────────────────────────────────────────────────────────────
  n3-e2e-repro:
    name: N3 — E2E + Reprodutibilidade
    needs: n2-integration
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: E2E (pipeline ponta a ponta sobre fixtures)
        run: pytest tests/e2e -m "not network"
      - name: Reprodutibilidade — duas árvores independentes, mesmo MANIFEST.json
        run: |
          set -euo pipefail
          for n in 1 2; do
            ARVORE="$RUNNER_TEMP/repro$n"
            mkdir -p "$ARVORE/data"
            cp -r tests/fixtures/processed "$ARVORE/data/processed"
            python -m apps.pipeline run --offline --ate build_raw_series --sem-duckdb --raiz "$ARVORE"
            python -m apps.pipeline verify --raiz "$ARVORE"
          done
          M1="$RUNNER_TEMP/repro1/data/canonical/MANIFEST.json"
          M2="$RUNNER_TEMP/repro2/data/canonical/MANIFEST.json"
          diff "$M1" "$M2"
          python -c "import json,sys; print('DATASET_SHA256=' + json.load(open(sys.argv[1]))['agregado']['sha256'])" "$M1"

# ───────────────────────────────────────────────────────────────
# Notas
# ───────────────────────────────────────────────────────────────
# - Os nomes sugeridos no esqueleto original (pipeline.build_canonical, pipeline.validate,
#   analysis.report) NÃO existem. O que foi implementado é o orquestrador de F-029:
#     python -m apps.pipeline run --offline [--ate ETAPA] [--sem-duckdb] [--raiz ARVORE]
#     python -m apps.pipeline verify [--raiz ARVORE]      (rc != 0 se um sha256 divergir)
#     python -m apps.pipeline freeze --tag <tag>          (MANIFEST.json + FROZEN.txt)
#   Correspondência registrada em docs/plans/DECISIONS_LOG.md (D-y) e em
#   docs/wiki/runbooks/reconstruir-dataset.md.
#
# - As figuras (F-023/F-025) e as tabelas (F-024) NÃO entram no N2/N3: elas dependem de
#   data/canonical/ completo, que as fixtures não sustentam (o trecho reproduzível é
#   `--ate build_raw_series`). A cobertura delas no CI é via tests/unit, que roda sintético.
#
# - Nenhum job acessa rede externa. Se um teste precisar de fonte viva, marque `@pytest.mark.network`
#   e rode local; o CI roda sempre com `-m "not network"`.
#
# - Nenhum job commita dado. `data/` é reconstruível e não versionado (ver .gitignore).
#
# - Para classe D (publicação ao Comitê / credencial paga), valide também fora do CI:
#     - Rollback documentado no Feature Contract e em docs/plans/infra-ops.md.
#     - Revisão humana do número antes do envio.
#     - Dataset congelado + linha RELEASE/VALIDATION em docs/wiki/log.md.
