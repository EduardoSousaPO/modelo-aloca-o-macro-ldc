name: CI

# Harness v3.2 — adaptado para projeto de dados/quant (Python)
#
# CI por níveis (N1 / N2 / N3). A classe de risco da feature (A / B / C / D — ver AGENTS.md §2)
# determina o nível mínimo que PRECISA estar verde antes do merge.
#
#   N1 — ruff check + ruff format --check + pytest tests/unit          → obrigatório para A, B
#   N2 — N1 + pytest tests/integration tests/contract (schemas pandera
#        sobre fixtures) + build do canônico a partir de fixtures      → obrigatório para B relevante, C
#   N3 — N2 + pytest tests/e2e (pipeline ponta a ponta) + conferência
#        de reprodutibilidade (rodar 2x → mesmo hash)                  → obrigatório para C crítica, D
#
# Regra deste projeto: NENHUM job de CI chama fonte externa. Testes de rede ficam marcados
# `@pytest.mark.network` e são excluídos com `-m "not network"`. Fonte externa em teste é sempre
# fixture gravada em tests/fixtures/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────
  # N1 — Sempre roda. Bloqueia merge para qualquer feature A/B/C/D.
  # ───────────────────────────────────────────────────────────────
  n1-basic:
    name: N1 — Lint + Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Unit tests
        run: pytest tests/unit -m "not network"

  # ───────────────────────────────────────────────────────────────
  # N2 — Roda em PR e em push para main. Obrigatório para B relevante/C.
  # Descomente quando existirem tests/integration e tests/contract.
  # ───────────────────────────────────────────────────────────────
  # n2-integration:
  #   name: N2 — Integration + Contract (pandera) + Build canônico
  #   needs: n1-basic
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.11"
  #         cache: "pip"
  #     - run: |
  #         python -m pip install --upgrade pip
  #         pip install -e ".[dev]"
  #     - name: Integration tests
  #       run: pytest tests/integration -m "not network"
  #     - name: Contract tests (schemas pandera sobre fixtures)
  #       run: pytest tests/contract -m "not network"
  #     - name: Build do dataset canônico a partir de fixtures
  #       run: python -m pipeline.build_canonical --from-fixtures --out /tmp/canonical
  #     - name: Validar schema do canônico gerado
  #       run: python -m pipeline.validate --path /tmp/canonical

  # ───────────────────────────────────────────────────────────────
  # N3 — Só em PR para main, ou manual. Obrigatório para C crítica/D.
  # Descomente quando o pipeline ponta a ponta rodar com fixtures.
  # ───────────────────────────────────────────────────────────────
  # n3-e2e-repro:
  #   name: N3 — E2E + Reprodutibilidade
  #   needs: n2-integration
  #   if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.11"
  #         cache: "pip"
  #     - run: |
  #         python -m pip install --upgrade pip
  #         pip install -e ".[dev]"
  #     - name: E2E (pipeline ponta a ponta sobre fixtures)
  #       run: pytest tests/e2e -m "not network"
  #     - name: Reprodutibilidade — rodar 2x e comparar hash
  #       run: |
  #         python -m pipeline.build_canonical --from-fixtures --out /tmp/run1
  #         python -m pipeline.build_canonical --from-fixtures --out /tmp/run2
  #         find /tmp/run1 -type f -exec sha256sum {} + | sed 's|/tmp/run1||' | sort > /tmp/h1
  #         find /tmp/run2 -type f -exec sha256sum {} + | sed 's|/tmp/run2||' | sort > /tmp/h2
  #         diff /tmp/h1 /tmp/h2
  #     - name: Smoke do relatório (sem publicar)
  #       run: python -m analysis.report --dry-run

# ───────────────────────────────────────────────────────────────
# Notas
# ───────────────────────────────────────────────────────────────
# - Os módulos referenciados nos jobs comentados (pipeline.build_canonical, pipeline.validate,
#   analysis.report) são NOMES SUGERIDOS. Ajuste ao que for implementado em apps/pipeline/ e
#   apps/analysis/, e mantenha a correspondência registrada em docs/plans/.
#
# - Nenhum job acessa rede externa. Se um teste precisar de fonte viva, marque `@pytest.mark.network`
#   e rode local; o CI roda sempre com `-m "not network"`.
#
# - Nenhum job commita dado. `data/` é reconstruível e não versionado (ver .gitignore).
#
# - Para classe D (publicação ao Comitê / credencial paga), valide também fora do CI:
#     - Rollback documentado no Feature Contract e em docs/plans/infra-ops.md.
#     - Revisão humana do número antes do envio.
#     - Dataset congelado + linha RELEASE/VALIDATION em docs/wiki/log.md.
